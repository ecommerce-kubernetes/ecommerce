eureka:
  client:
    enable: false
    fetch-registry: false
    register-with-eureka: false

spring:
  cloud:
    config:
      enabled: false
    openfeign:
      loadbalancer:
        enabled: false
    discovery:
      client:
        simple:
          instances:
            product-service:
              - uri: http://localhost:${wiremock.server.port}
            user-service:
              - uri: http://localhost:${wiremock.server.port}
            coupon-service:
              - uri: http://localhost:${wiremock.server.port}
  kafka:
    bootstrap-servers: 127.0.0.1:9092
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
    consumer:
      group-id: orders
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer

  jpa:
    hibernate:
      ddl-auto: create-drop
  flyway:
    enabled: false
  output:
    ansi:
      enabled: always

payment:
  toss:
    url: https://api.tosspayments.com
    secret-key: secretKey
  timeout-minute:
    timeout-ready: 30
    timeout-approve-pending: 5
    timeout-refund-pending: 5

saga:
  timeout-minute:
    timeout-forward-pending: 5
    timeout-compensate-pending: 5

order:
  timeout-minute: 30
  topics:
    product-saga-command: "product.saga.command"
    coupon-saga-command: "coupon.saga.command"
    user-saga-command: "user.saga.command"
    order-saga-reply: "order.saga.reply"
  sheet:
    ttl-minutes: 30

logging:
  loki:
    url: http://localhost:3100/loki/api/v1/push